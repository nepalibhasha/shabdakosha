<!doctype html>
<html lang="ne">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Search and compare entries across generated Nepali dictionary sources.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2317201c'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E0%A4%B6%3C/text%3E%3C/svg%3E">
    <title>{% block title %}Shabdakosha{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/">
          <span class="brand-mark">श</span>
          <span>
            <strong>Shabdakosha</strong>
            <small>Nepali dictionary source browser</small>
          </span>
        </a>
        <form class="search-shell" action="/search" method="get" data-autocomplete>
          <label class="sr-only" for="global-search">Search headwords</label>
          <div class="autocomplete-wrap">
            <input id="global-search" name="q" value="{{ q or '' }}" placeholder="Search headwords or base words" autocomplete="off">
            <button type="button" class="input-clear" aria-label="Clear search" hidden>&times;</button>
            <div class="suggestion-panel" data-suggestions hidden></div>
          </div>
          <label class="sr-only" for="dictionary-filter">Dictionary</label>
          <select id="dictionary-filter" name="dictionary_id">
            <option value="">All dictionaries</option>
            {% for dictionary in dictionaries or [] %}
              <option value="{{ dictionary.id }}" {% if dictionary_id == dictionary.id %}selected{% endif %}>
                {{ dictionary.id }}
              </option>
            {% endfor %}
          </select>
          <button type="submit">Search</button>
        </form>
      </div>
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
