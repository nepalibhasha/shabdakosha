{% extends "base.html" %}

{% block title %}Compare {{ base_word }}{% endblock %}

{% block content %}
  <h1>Compare {{ base_word }}</h1>
  {% for entry in entries %}
    <article>
      <h2>{{ entry.word }}</h2>
      <p>{{ entry.dictionary_id }} · {{ entry.source_file }}</p>
      <p>{{ entry.definition }}</p>
    </article>
  {% endfor %}
{% endblock %}
